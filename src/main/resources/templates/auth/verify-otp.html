<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận OTP</title>
    <link rel="stylesheet" href="/webjars/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3>Xác nhận mã OTP</h3>
                    </div>
                    <div class="card-body">
                        <p>Vui lòng kiểm tra email <strong th:text="${email}"></strong> để nhận mã xác nhận.</p>
                        <p class="text-muted">Nếu bạn chưa nhận được email, vui lòng đợi 1-2 phút hoặc kiểm tra thư mục spam.</p>
                        
                        <form th:action="@{/verify-otp}" method="post">
                            <input type="hidden" name="email" th:value="${email}">
                            <div class="mb-3">
                                <label for="otp" class="form-label">Mã xác nhận (6 chữ số):</label>
                                <input type="text" class="form-control" id="otp" name="otp" maxlength="6" required>
                            </div>
                            <button type="submit" class="btn btn-primary">Xác nhận</button>
                        </form>
                        
                        <div class="mt-3">
                            <a href="/login">Quay lại đăng nhập</a>
                        </div>
                        
                        <div th:if="${error}" class="alert alert-danger mt-3" role="alert">
                            <span th:text="${error}"></span>
                        </div>
                        
                        <div th:if="${message}" class="alert alert-success mt-3" role="alert">
                            <span th:text="${message}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
